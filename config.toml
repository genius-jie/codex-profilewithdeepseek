# ==============================================================================
# Codex Profile Configuration with DeepSeek & Third-Party Models
# Managed via CodexManager (CM / 可乐) Gateway
# ==============================================================================

model = "deepseek-v4-pro"
model_provider = "cm"
model_catalog_json = "./model_catalog.json"
approval_policy = "never"
sandbox_mode = "danger-full-access"
network_access = "enabled"
approvals_reviewer = "user"
mcp_oauth_credentials_store = "auto"
model_reasoning_effort = "medium"
disable_response_storage = false

# CodexManager (可乐网关) 统一反向代理接入
[model_providers.cm]
name = "OpenAI"
base_url = "http://127.0.0.1:48760/v1"
env_key = "CM_API_KEY"
# 默认本地网关连接凭据，请替换为您的实际密钥或环境变量
api_key = "YOUR_CODEX_MANAGER_API_KEY"

[features]
hooks = true
memories = true
js_repl = false

[windows]
sandbox = "elevated"

# BEGIN CODEX++ MANAGED MCP SERVERS
[mcp_servers.windows-computer-use]
command = "node"
args = ["D:\\CodexPlusPlusProfile\\AppData\\Roaming\\codex-plusplus\\tweaks\\co.bennett.windows-computer-use\\mcp-server.js"]
# END CODEX++ MANAGED MCP SERVERS