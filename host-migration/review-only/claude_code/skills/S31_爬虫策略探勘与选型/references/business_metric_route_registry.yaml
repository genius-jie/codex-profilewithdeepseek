schema_version: s31_business_metric_route_registry.v1
last_verified: '2026-06-12'
owner_skill: @@GENERAL_ROOT:win@@\skills\S31_爬虫策略探勘与选型\SKILL.md
baseline_ref: subskills/S31A_数据源探针与路线选型/references/platform_crawl_maturity_baseline.yaml
fact_pack_contract_ref: subskills/S31D_爬虫事实包契约/scripts/crawler_fact_pack.py
runner_ref: subskills/S31C_内容平台事实采集/scripts/platform_shard_runner.py
policy:
  lookup_key: platform + metric_id
  command_builder: subskills/S31C_内容平台事实采集/scripts/business_metric_routes.py
  opencli_command_surface: lookup.opencli_commands must expose the direct OpenCLI or Browser Bridge command surface for every non-unavailable metric route.
  fact_boundary: Metrics must resolve to observed fact rows, command receipts, or explicit unsupported/discovery-only status.
  unsupported_metric_status: unsupported_metric_for_platform
  freshness_clock: fact_pack.collected_at
route_levels:
  L3_live_metric: Public live route with observed rows and repeatable OpenCLI/site adapter execution.
  L2_controlled_metric: Controlled session or human-captured route; observed rows allowed only with session/preflight evidence.
  L1_browser_metric: Browser bridge, RSS, SSR, or HTML-derived route; slower and requires page/body evidence.
  L0_discovery: Candidate URL or source discovery only; no direct fact import.
  L0_unavailable: Current system must not import this metric for the platform.
freshness_slas:
  near_live_6h:
    max_age_minutes: 360
    stale_action: rerun_metric_route
  daily_24h:
    max_age_minutes: 1440
    stale_action: rerun_daily_or_on_demand
  controlled_24h:
    max_age_minutes: 1440
    stale_action: rerun_after_session_preflight
  weekly_reference:
    max_age_minutes: 10080
    stale_action: rerun_reference_route
  discovery_only:
    max_age_minutes: 1440
    stale_action: handoff_candidate_urls_to_primary_platform
metrics:
  review_count:
    target_fields: [review_count, comment_count, comments]
    default_fact_pack_paths: ["items[].metrics.comments", "items[].metrics.comment_count", "fact_summary.item_count"]
    default_freshness_sla: daily_24h
    acceptance_gates: [source_url_required, count_or_review_rows_required]
  rating_average:
    target_fields: [rating, rating_average, score, star_rating]
    default_fact_pack_paths: ["items[].metrics.rating", "items[].metrics.score"]
    default_freshness_sla: daily_24h
    acceptance_gates: [rating_scale_known, source_url_required]
  review_text_sample:
    target_fields: [review_body, comment_text, body, top_comments]
    default_fact_pack_paths: ["items[].body", "items[].top_comments[].text"]
    default_freshness_sla: daily_24h
    acceptance_gates: [non_empty_body_or_comment_required, source_url_required]
  negative_review_signal:
    target_fields: [review_body, comment_text, rating, pain_terms]
    default_fact_pack_paths: ["items[].body", "items[].top_comments[].text", "fact_summary.review_text_high_frequency_pain_terms"]
    default_freshness_sla: daily_24h
    acceptance_gates: [observed_text_required, inference_separated_from_facts]
  price_current:
    target_fields: [sale_price, list_price, current_price, promotion_price]
    default_fact_pack_paths: ["items[].metrics.price", "items[].metrics.sale_price", "items[].business.price"]
    default_freshness_sla: near_live_6h
    acceptance_gates: [seller_or_item_identity_required, price_timestamp_required]
  sku_variant:
    target_fields: [sku, variant, color, model, specification]
    default_fact_pack_paths: ["items[].metrics.sku", "items[].business.sku", "items[].tags"]
    default_freshness_sla: daily_24h
    acceptance_gates: [item_identity_required, variant_text_required]
  sales_volume_signal:
    target_fields: [sales_count, sold_count, order_count, popularity]
    default_fact_pack_paths: ["items[].metrics.sales", "items[].metrics.sold_count", "items[].metrics.views"]
    default_freshness_sla: near_live_6h
    acceptance_gates: [visible_metric_required, platform_semantics_documented]
  resale_price:
    target_fields: [resale_price, asking_price, listing_price]
    default_fact_pack_paths: ["items[].metrics.price", "items[].metrics.resale_price"]
    default_freshness_sla: near_live_6h
    acceptance_gates: [listing_url_required, condition_or_description_required]
  listing_condition:
    target_fields: [condition, description, resale_reason]
    default_fact_pack_paths: ["items[].body", "items[].tags", "items[].business.condition"]
    default_freshness_sla: daily_24h
    acceptance_gates: [listing_url_required, observed_condition_text_required]
  social_engagement:
    target_fields: [likes, comments, shares, views, reposts]
    default_fact_pack_paths: ["items[].metrics.likes", "items[].metrics.comments", "items[].metrics.shares", "items[].metrics.views"]
    default_freshness_sla: near_live_6h
    acceptance_gates: [post_url_required, metric_snapshot_required]
  content_publish_time:
    target_fields: [published_at, created_at, review_date, update_time]
    default_fact_pack_paths: ["items[].published_at", "items[].metrics.published_at", "items[].data_quality_flags"]
    default_freshness_sla: daily_24h
    acceptance_gates: [source_url_required, timestamp_or_quality_flag_required]
  local_business_rating:
    target_fields: [shop_rating, rating, score, review_count]
    default_fact_pack_paths: ["items[].metrics.rating", "items[].metrics.comments"]
    default_freshness_sla: daily_24h
    acceptance_gates: [shop_id_or_url_required, rating_or_review_rows_required]
  discovery_candidate_url:
    target_fields: [title, url, source_name, snippet]
    default_fact_pack_paths: []
    default_freshness_sla: discovery_only
    acceptance_gates: [candidate_url_required, no_direct_fact_import]
