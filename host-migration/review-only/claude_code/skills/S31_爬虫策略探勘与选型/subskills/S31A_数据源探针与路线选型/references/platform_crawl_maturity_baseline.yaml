schema_version: platform_crawl_maturity_baseline.v1
generated_from: tophub-daily-trend-radar/docs/w11-p3-evidence/s31-platform-fact-maturity-matrix-20260610.json
last_verified: '2026-06-11'
source_family_mapping:
  marketplace_review: commerce_marketplace
  resale_listing: secondhand_marketplace
  content_social: social_content
  community_forum: forum_community
  local_life_review: local_life_review
  search_discovery: search_news
closure_policy:
  fact_source_target: M5
  discovery_source_target: discovery_closure
  discovery_source_families:
  - search_news
  discovery_m5_exempt: true
  discovery_fact_import_allowed: false
scheduler_policy:
  provider: OpenClaw Cron
  owner_skill: '@@OPENCLAW_ROOT:win@@\.agents\skills\S28_定时任务编排\SKILL.md'
  runtime_source_of_truth: '@@USERPROFILE:win@@\.openclaw\cron\jobs.json'
  registration_command: openclaw cron add|edit|list
  s31_boundary: S31/OpenCLI only produces repeatable collection commands, receipts, and fact packs; scheduled execution belongs to OpenClaw Cron.
  forbidden_local_scripts:
  - daily_crawl_orchestrator.py
maturity_policy:
- tier: M5
  label: Sealed Fact Source
  route_behavior: priority_route
- tier: M4
  label: Stable Reference Route
  route_behavior: priority_route
- tier: M3
  label: Partial Fact Route
  route_behavior: extensible_route
- tier: M2
  label: Controlled/Recovery Route
  route_behavior: controlled_input
- tier: M1
  label: Discovery Only
  route_behavior: discovery_handoff_only
- tier: M0
  label: Skipped/Unproven
  route_behavior: skipped
